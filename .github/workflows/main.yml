name: Release
on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Command
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      contains(github.event.comment.body, '/release-action')
      && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    outputs:
      release_tag: ${{ steps.extract_version.outputs.TAG }}
      version: ${{ steps.extract_version.outputs.VERSION }}
      rev: ${{ steps.extract_version.outputs.REV }}
      release_name: ${{ steps.extract_version.outputs.RELEASE_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Extract & verify version
        id: extract_version
        run: |
          VER_FILE=libraries/libvapours/include/vapours/ams/ams_api_version.h
          
          MAJOR=$(awk '/^#define ATMOSPHERE_RELEASE_VERSION_MAJOR/{print $3}' "$VER_FILE" | tr -d '[:space:]')
          MINOR=$(awk '/^#define ATMOSPHERE_RELEASE_VERSION_MINOR/{print $3}' "$VER_FILE" | tr -d '[:space:]')
          MICRO=$(awk '/^#define ATMOSPHERE_RELEASE_VERSION_MICRO/{print $3}' "$VER_FILE" | tr -d '[:space:]')
          
          echo "DEBUG MAJOR: >${MAJOR}<"
          echo "DEBUG MINOR: >${MINOR}<"
          echo "DEBUG MICRO: >${MICRO}<"
          
          if [[ -z "${MAJOR}" || -z "${MINOR}" || -z "${MICRO}" ]]; then
            echo "::error::❌ Can't read version from ${VER_FILE}, please check the file format!"
            exit 1
          fi
          
          VERSION="${MAJOR}.${MINOR}.${MICRO}"
          TAG="${VERSION}-with-sigpatch"
          REV=$(git rev-parse --short=9 HEAD)
          RELEASE_NAME="Atmosphère ${VERSION} with sigpatch"
          
          if [[ -z "${REV}" ]]; then
            echo "::error::❌ Can't fetch Git commit hash!"
            exit 1
          fi
          
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "REV=${REV}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "✅ Version: ${VERSION}, Tag: ${TAG}, Rev: ${REV}"

      - name: Check git tag exists
        run: |
          TAG=${{ steps.extract_version.outputs.TAG }}
          if git rev-parse "tags/$TAG" >/dev/null 2>&1; then
            echo "::error::❌ Tag $TAG already exists, reposting is prohibited. Please update the version number first!"
            exit 1
          fi

  build:
    name: Build Atmosphère (Switch)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 120
    needs: validate
    steps:
      - name: Configure git safe directory
        run: git config --global --add safe.directory "*"
        shell: bash

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y zip unzip
        shell: bash

      - name: Update latest libnx
        run: |
          git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          cd libnx
          make install -j$(nproc)
        shell: bash

      - name: Checkout latest code
        uses: actions/checkout@v7
        with:
          ref: master
          clean: true
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Build
        env:
          VER: ${{ needs.validate.outputs.version }}
          REV: ${{ needs.validate.outputs.rev }}
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -f atmosphere.mk dist-no-debug
        shell: bash

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: atmosphere-release-assets
          path: |
            ./out/nintendo_nx_arm64_armv8a/release/atmosphere-${{ needs.validate.outputs.version }}-master-${{ needs.validate.outputs.rev }}.zip
            ./out/nintendo_nx_arm64_armv8a/release/fusee.bin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, build]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: atmosphere-release-assets
          path: atmosphere-release-assets

      - name: Verify downloaded files
        run: ls -lh atmosphere-release-assets/

      - name: Publish release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          REV: ${{ needs.validate.outputs.rev }}
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
        run: |
          set -e
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"beta"* || "$TAG" == *"alpha"* || "$TAG" == *"rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if ! git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Tag $TAG Created and successfully pushed!"
          else
            echo "ℹ️ Tag $TAG already exists, skipping push!"
          fi

          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            --latest \
            $PRERELEASE_FLAG \
            "atmosphere-release-assets/atmosphere-${VERSION}-master-${REV}.zip#Atmosphere-${TAG}.zip" \
            "atmosphere-release-assets/fusee.bin#fusee-${TAG}.bin"
        continue-on-error: true

      - name: Reply result to /release-action comment
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const tag = '${{ needs.validate.outputs.release_tag }}';
            const success = '${{ steps.publish_release.outcome }}' === 'success';
            const repo = '${{ github.repository }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const triggerCommentId = ${{ github.event.comment.id }};
            const issueNumber = context.issue.number;
            const [owner, repoName] = repo.split('/');

            let body;
            if (success) {
              body = `✅ Release **${tag}** created successfully!\nRelease: https://github.com/${repo}/releases/tag/${tag}`;
            } else {
              body = `❌ Release **${tag}** creation failed. Please check the pipeline log: ${runUrl}`;
            }

            try {
              await github.rest.issues.createCommentReply({
                owner: owner,
                repo: repoName,
                comment_id: triggerCommentId,
                body: body
              });
            } catch (err) {
              console.error('Sub-reply failed, demoted to top-level comment: ', err.message);
              await github.rest.issues.createComment({
                owner: owner,
                repo: repoName,
                issue_number: issueNumber,
                body: body
              });
            }
